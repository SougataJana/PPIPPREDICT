name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'
          
      - name: Install Streamlit Wakeup
        run: pip install streamlit-wakeup
        
      - name: Wake Up App
        run: streamlit-wakeup https://ppippredict.streamlit.app
